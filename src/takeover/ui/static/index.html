<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shogi-takeover</title>
<!--
  仕様: docs/SPEC.md §6.7
  - 単一ファイル・素の JS・ビルドなし。
  - WebSocket で受け取った snapshot を描画するだけ。合法手はサーバから受け取り、ここでは判定しない。
  - コマンドには表示中の snapshot の ply と対象の color を付ける。
-->
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #222; --muted: #777; --line: #c9c2b2;
  --board: #e9c98b; --grid: #6b4a1f; --last: #f6a65a; --pick: #7fc8f8; --dest: #9be29b;
  --auto: #2e9e4f; --manual: #e8820c; --warn: #c62828; --cell: min(10.2vw, 56px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1f22; --panel: #282b30; --ink: #e8e6e1; --muted: #9a9a9a; --line: #454a52; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; }
body { padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
button:disabled { opacity: .4; cursor: default; }
#app { display: grid; gap: 10px; grid-template-columns: auto minmax(260px, 1fr); align-items: start;
  max-width: 1100px; margin: 0 auto; }
#left { display: grid; gap: 6px; justify-items: stretch; width: calc(var(--cell) * 9 + 4px); }
#status { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-size: 14px; color: var(--muted); }
#status b { color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); display: inline-block; }
.dot.on { background: var(--auto); }

.seat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.seat.turn { outline: 3px solid var(--last); }
.seat .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .clock { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
.seat .clock.low { color: var(--warn); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-weight: 700;
  font-size: 14px; letter-spacing: .05em; }
.badge.auto { background: var(--auto); } .badge.manual { background: var(--manual); }
.badge.remote { background: var(--muted); }
.seat .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hand { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; min-height: 34px; align-items: center; }
.hand .hp { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--board);
  color: #222; font-size: 20px; cursor: default; user-select: none; }
.hand .hp.can { cursor: pointer; } .hand .hp.picked { background: var(--pick); }
.hand .hp small { font-size: 12px; margin-left: 2px; }
.toggle { font-weight: 700; }

#board { display: grid; grid-template-columns: repeat(9, var(--cell)); grid-template-rows: repeat(9, var(--cell));
  background: var(--board); border: 2px solid var(--grid); user-select: none; touch-action: manipulation; }
.sq { border: 1px solid var(--grid); display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--cell) * .62); color: #1a1a1a; line-height: 1; position: relative;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
.sq.white span { transform: rotate(180deg); display: inline-block; }
.sq.promoted span { color: #b71c1c; }
.sq.last { background: var(--last); } .sq.picked { background: var(--pick); }
.sq.dest::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--dest);
  opacity: .9; }
.sq.dest.occupied::after { inset: 6%; background: none; border: 4px solid var(--dest); }
.sq.can { cursor: pointer; }

#actions { display: flex; gap: 8px; flex-wrap: wrap; }
#actions button { flex: 1; }
#resign, #declare { border-color: var(--warn); }

#right { display: grid; gap: 10px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.card h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
.info { font-size: 14px; line-height: 1.5; word-break: break-all; }
.info .score { font-weight: 700; font-size: 18px; margin-right: 8px; }
#moves { max-height: 260px; overflow-y: auto; font-size: 14px; font-variant-numeric: tabular-nums; }
#moves table { border-collapse: collapse; width: 100%; }
#moves td { padding: 1px 6px; white-space: nowrap; }
#moves tr.cur { background: var(--last); color: #222; }
#notices { max-height: 140px; overflow-y: auto; font-size: 13px; }
#notices div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
#lan { font-size: 13px; word-break: break-all; }
#result { font-weight: 700; color: var(--warn); }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); }
dialog .btns { display: flex; gap: 12px; margin-top: 12px; }
dialog button { min-width: 96px; min-height: 52px; font-size: 20px; }

@media (max-width: 760px) {
  :root { --cell: calc((100vw - 20px) / 9); }
  #app { grid-template-columns: 1fr; }
  #left { width: 100%; }
  .toggle, #actions button { min-height: 52px; font-size: 18px; }
  #actions { display: grid; grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <div id="status">
    <span><span class="dot" id="conn"></span> <span id="connText">接続中…</span></span>
    <span id="phase"></span><span id="game"></span><span id="result"></span>
  </div>
  <div id="left">
    <div class="seat" id="seatTop"></div>
    <div id="board"></div>
    <div class="seat" id="seatBottom"></div>
    <div id="actions">
      <button id="flip">盤を反転</button>
      <button id="hint">ヒント: オフ</button>
      <button id="resign" disabled>投了</button>
      <button id="declare" disabled>宣言勝ち</button>
    </div>
  </div>
  <div id="right">
    <div class="card"><h3>エンジン情報（評価値は <span id="viewLabel">先手</span> 視点）</h3>
      <div class="info" id="infoB"></div><div class="info" id="infoW"></div></div>
    <div class="card" id="hintCard" hidden><h3>ヒント（表示専用）</h3><div class="info" id="hintBox"></div></div>
    <div class="card"><h3>棋譜（🧑 人間 / 🤖 エンジン / 🌐 相手）</h3><div id="moves"></div></div>
    <div class="card"><h3>通知</h3><div id="notices"></div></div>
    <div class="card" id="lanCard" hidden><h3>スマホから開く URL</h3><div id="lan"></div></div>
  </div>
</div>
<dialog id="promo"><div>成りますか？</div>
  <div class="btns"><button id="promoYes">成る</button><button id="promoNo">不成</button></div></dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KANJI = {P:"歩",L:"香",N:"桂",S:"銀",G:"金",B:"角",R:"飛",K:"玉",
               "+P":"と","+L":"杏","+N":"圭","+S":"全","+B":"馬","+R":"龍"};
const HAND_ORDER = ["R","B","G","S","N","L","P"];
const ACTOR = {human:"🧑", engine:"🤖", remote:"🌐"};
const PHASE = {connecting:"接続中", waiting_game:"対局待ち", ready:"開始待ち", playing:"対局中", ended:"終局"};
const REASON = {resign:"投了", time_up:"時間切れ", illegal_move:"反則", sennichite:"千日手",
  oute_sennichite:"連続王手の千日手", jishogi:"入玉宣言", illegal_declaration:"宣言不成立",
  max_moves:"最大手数", mate:"詰み", chudan:"中断", disconnected:"切断", unknown:""};
const RESULT = {black_win:"先手の勝ち", white_win:"後手の勝ち", draw:"引き分け", aborted:"中断"};

let ws = null, snap = null, snapAt = 0, flipped = false, userFlipped = false;
let picked = null;          // {from:"7g"} か {drop:"P"}
let notifyMyTurn = true, wasMyTurn = false;
const info = {b: null, w: null}, hints = {};

// ---- 通信 ----
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
  ws.onopen = () => { $("conn").classList.add("on"); $("connText").textContent = "接続中"; };
  ws.onclose = () => { $("conn").classList.remove("on"); $("connText").textContent = "切断（再接続します）";
                       setTimeout(connect, 1000); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function handle(m) {
  if (m.type === "snapshot") { snap = m; snapAt = performance.now(); picked = null; render(); }
  else if (m.type === "engine_info") {
    if (m.kind === "hint") { hints[m.multipv] = m; renderHints(); }
    else { info[m.color] = m; renderInfo(); }
  }
  else if (m.type === "notice") addNotice(m.text);
  else if (m.type === "hello") {
    notifyMyTurn = !!m.notify_my_turn;
    if (m.lan_url) { $("lanCard").hidden = false; $("lan").textContent = m.lan_url; }
  }
}

// ---- 盤 ----
function parseSfen(sfen) {
  const [boardPart, , handPart] = sfen.split(" ");
  const cells = {};
  boardPart.split("/").forEach((row, r) => {
    let file = 9, promo = false;
    for (const ch of row) {
      if (ch === "+") { promo = true; continue; }
      if (/\d/.test(ch)) { file -= Number(ch); continue; }
      const upper = ch.toUpperCase();
      cells[`${file}${"abcdefghi"[r]}`] = {piece: (promo ? "+" : "") + upper, color: ch === upper ? "b" : "w"};
      promo = false; file -= 1;
    }
  });
  const hands = {b: {}, w: {}};
  if (handPart && handPart !== "-") {
    let n = "";
    for (const ch of handPart) {
      if (/\d/.test(ch)) { n += ch; continue; }
      const upper = ch.toUpperCase();
      hands[ch === upper ? "b" : "w"][upper] = n ? Number(n) : 1;
      n = "";
    }
  }
  return {cells, hands};
}

function humanColor() { return snap && snap.legal_moves.length ? snap.turn : null; }
function destinations() {
  if (!picked || !snap) return {};
  const out = {};
  for (const usi of snap.legal_moves) {
    const isDrop = usi[1] === "*";
    if (picked.drop ? (isDrop && usi[0] === picked.drop) : (!isDrop && usi.slice(0, 2) === picked.from)) {
      (out[usi.slice(2, 4)] ||= []).push(usi);
    }
  }
  return out;
}

function render() {
  if (!snap) return;
  if (!userFlipped) flipped = snap.view === "w";
  const {cells, hands} = parseSfen(snap.sfen);
  const mover = humanColor();
  const dests = destinations();
  const sources = new Set(snap.legal_moves.filter(u => u[1] !== "*").map(u => u.slice(0, 2)));
  const last = snap.last_move ? snap.last_move.slice(2, 4) : null;
  const board = $("board");
  board.textContent = "";
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    const file = flipped ? c + 1 : 9 - c, rank = "abcdefghi"[flipped ? 8 - r : r];
    const sq = `${file}${rank}`, cell = cells[sq];
    const div = document.createElement("div");
    div.className = "sq"; div.dataset.sq = sq;
    if (cell) {
      const span = document.createElement("span");
      span.textContent = KANJI[cell.piece] || "?";
      div.appendChild(span);
      if ((cell.color === "w") !== flipped) div.classList.add("white");
      if (cell.piece[0] === "+") div.classList.add("promoted");
    }
    if (sq === last) div.classList.add("last");
    if (picked && picked.from === sq) div.classList.add("picked");
    if (dests[sq]) { div.classList.add("dest", "can"); if (cell) div.classList.add("occupied"); }
    if (mover && cell && cell.color === mover && sources.has(sq)) div.classList.add("can");
    div.onclick = () => clickSquare(sq);
    board.appendChild(div);
  }
  const bottom = flipped ? "w" : "b", top = flipped ? "b" : "w";
  renderSeat($("seatBottom"), bottom, hands[bottom], mover);
  renderSeat($("seatTop"), top, hands[top], mover);
  renderStatus(); renderMoves(); renderInfo(); renderHints(); tick();
  $("resign").disabled = !mover;
  $("declare").disabled = !(mover && snap.can_declare);
  $("hint").textContent = `ヒント: ${snap.hint_enabled ? "オン" : "オフ"}`;
  $("hintCard").hidden = !snap.hint_enabled;
  $("viewLabel").textContent = snap.view === "w" ? "後手" : "先手";
  const myTurn = !!mover;
  if (myTurn && !wasMyTurn && notifyMyTurn) notify();
  wasMyTurn = myTurn;
}

function renderSeat(el, color, hand, mover) {
  const seat = snap.seats[color] || {kind: "remote", name: "", mode: null};
  el.className = "seat" + (snap.phase === "playing" && snap.turn === color ? " turn" : "");
  el.textContent = "";
  const left = document.createElement("div"); left.className = "row";
  const name = document.createElement("span"); name.className = "name";
  name.textContent = `${color === "b" ? "☗" : "☖"} ${seat.name || ""}`;
  const badge = document.createElement("span");
  badge.className = "badge " + (seat.mode || "remote");
  badge.textContent = seat.mode ? seat.mode.toUpperCase() : "相手";
  left.append(name, badge);
  if (seat.kind === "local") {
    const btn = document.createElement("button");
    btn.className = "toggle";
    btn.textContent = seat.mode === "auto" ? "奪取（自分で指す）" : "返却（エンジンに戻す）";
    btn.disabled = snap.phase === "ended" || (seat.mode === "manual" && !seat.has_engine);
    btn.onclick = () => toggleMode(color);
    left.append(btn);
  }
  const clock = document.createElement("div"); clock.className = "clock"; clock.dataset.color = color;
  const handEl = document.createElement("div"); handEl.className = "hand";
  for (const p of HAND_ORDER) {
    const n = hand[p]; if (!n) continue;
    const hp = document.createElement("span"); hp.className = "hp"; hp.dataset.piece = p;
    hp.textContent = KANJI[p];
    if (n > 1) { const s = document.createElement("small"); s.textContent = n; hp.appendChild(s); }
    if (mover === color && snap.legal_moves.some(u => u[0] === p && u[1] === "*")) {
      hp.classList.add("can"); hp.onclick = () => { picked = (picked && picked.drop === p) ? null : {drop: p}; render(); };
    }
    if (picked && picked.drop === p && mover === color) hp.classList.add("picked");
    handEl.appendChild(hp);
  }
  el.append(left, clock, handEl);
}

function clickSquare(sq) {
  if (!snap || !humanColor()) return;
  const dests = destinations();
  if (dests[sq]) {
    const moves = dests[sq];
    if (moves.length === 1) return commit(moves[0]);
    const dlg = $("promo");
    $("promoYes").onclick = () => { dlg.close(); commit(moves.find(u => u.endsWith("+"))); };
    $("promoNo").onclick = () => { dlg.close(); commit(moves.find(u => !u.endsWith("+"))); };
    dlg.showModal();
    return;
  }
  const hasMoves = snap.legal_moves.some(u => u[1] !== "*" && u.slice(0, 2) === sq);
  picked = hasMoves && !(picked && picked.from === sq) ? {from: sq} : null;
  render();
}
function commit(usi) {
  if (!usi) return;
  send({type: "move", color: snap.turn, ply: snap.ply, usi});
  picked = null; render();
}
function toggleMode(color) {
  const seat = snap.seats[color];
  if (!seat || seat.kind !== "local") return;
  send({type: "set_mode", color, mode: seat.mode === "auto" ? "manual" : "auto"});
}

// ---- 表示 ----
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function tick() {
  if (!snap || !snap.clock) return;
  const c = snap.clock, since = performance.now() - snapAt;
  document.querySelectorAll(".clock").forEach(el => {
    const color = el.dataset.color;
    let ms = c.remaining_ms[color], text;
    if (c.running === color && snap.phase === "playing") ms -= c.turn_elapsed_ms + since;
    if (ms <= 0 && c.byoyomi_ms) { text = `秒読み ${fmtClock(c.byoyomi_ms + ms)}`; ms = c.byoyomi_ms + ms; }
    else text = fmtClock(ms);
    if (c.increment_ms) text += ` +${c.increment_ms / 1000}`;
    el.textContent = text;
    el.classList.toggle("low", ms < 30000);
  });
}
setInterval(tick, 200);

function fmtScore(s) {
  if (!s) return "";
  if (s.mate !== null && s.mate !== undefined) return (s.mate > 0 ? "詰み " : "詰まされ ") + Math.abs(s.mate) + "手";
  if (s.cp === null || s.cp === undefined) return "";
  return (s.cp > 0 ? "+" : "") + s.cp + (s.bound === "lower" ? "↑" : s.bound === "upper" ? "↓" : "");
}
function fmtNum(n) { return n === null || n === undefined ? "-" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n); }
function infoLine(el, m, label) {
  el.textContent = "";
  if (!m) return;
  const head = document.createElement("div");
  const sc = document.createElement("span"); sc.className = "score"; sc.textContent = fmtScore(m.score);
  head.append(`${label} `, sc, `深さ ${m.depth ?? "-"}  ノード ${fmtNum(m.nodes)}  NPS ${fmtNum(m.nps)}`);
  const pv = document.createElement("div"); pv.textContent = (m.pv_labels || m.pv || []).join(" ");
  el.append(head, pv);
}
function renderInfo() {
  infoLine($("infoB"), info.b, "☗" + (info.b && info.b.kind === "ponder" ? "（先読み）" : ""));
  infoLine($("infoW"), info.w, "☖" + (info.w && info.w.kind === "ponder" ? "（先読み）" : ""));
}
function renderHints() {
  const box = $("hintBox"); box.textContent = "";
  if (!snap || !snap.hint_enabled || !humanColor()) { for (const k in hints) delete hints[k]; return; }
  Object.keys(hints).sort((a, b) => a - b).forEach(k => {
    const row = document.createElement("div"); infoLine(row, hints[k], `候補${k}`); box.appendChild(row);
  });
}
function renderStatus() {
  $("phase").innerHTML = ""; $("phase").append("状態: "); const b = document.createElement("b");
  b.textContent = PHASE[snap.phase] || snap.phase; $("phase").append(b, `　${snap.ply} 手`);
  $("game").textContent = snap.game_id && snap.game_id !== "local" ? snap.game_id : "";
  $("result").textContent = snap.result ? `${RESULT[snap.result] || snap.result}（${REASON[snap.end_reason] || snap.end_reason || ""}）` : "";
}
function renderMoves() {
  const box = $("moves"), table = document.createElement("table");
  snap.moves.forEach((m, i) => {
    const tr = document.createElement("tr"); if (i === snap.moves.length - 1) tr.className = "cur";
    for (const text of [m.ply, m.label, ACTOR[m.actor] || "", m.elapsed_ms === null ? "" : `${Math.round(m.elapsed_ms / 1000)}秒`, fmtScore(m.score)]) {
      const td = document.createElement("td"); td.textContent = text; tr.appendChild(td);
    }
    table.appendChild(tr);
  });
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.textContent = ""; box.appendChild(table);
  if (atEnd) box.scrollTop = box.scrollHeight;
}
function addNotice(text) {
  const div = document.createElement("div");
  div.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  $("notices").prepend(div);
  while ($("notices").children.length > 50) $("notices").lastChild.remove();
}
function notify() {
  try {
    if (navigator.vibrate) navigator.vibrate(120);
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 880; gain.gain.value = 0.05; osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12); osc.onended = () => ctx.close();
  } catch (e) { /* 音が出せない環境では何もしない */ }
}

// ---- ボタン・キー ----
$("flip").onclick = () => { flipped = !flipped; userFlipped = true; render(); };
$("hint").onclick = () => { if (snap) send({type: "set_hint", enabled: !snap.hint_enabled}); };
$("resign").onclick = () => {
  const c = humanColor();
  if (c && confirm("投了しますか？")) send({type: "resign", color: c, ply: snap.ply});
};
$("declare").onclick = () => {
  const c = humanColor();
  if (c && confirm("入玉宣言をしますか？")) send({type: "declare", color: c, ply: snap.ply});
};
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || !snap || e.target.tagName === "BUTTON") return;
  e.preventDefault();
  toggleMode(snap.my_color || snap.turn);   // CSA モードは自席、ローカルモードは手番側
});
connect();
</script>
</body>
</html>
